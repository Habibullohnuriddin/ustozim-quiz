name: Kunlik quiz e'loni

on:
  schedule:
    # 15:00 UTC = 20:00 Toshkent vaqti (UTC+5)
    - cron: "0 15 * * *"
  workflow_dispatch:

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: E'lonni joylashtirish
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          QUIZ_URL: ${{ vars.QUIZ_URL }}
          TOPIC_ID: ${{ vars.TOPIC_ID }}
          PIN: ${{ vars.PIN }}
        run: python post_daily_announcement.py
